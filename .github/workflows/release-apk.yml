name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (leave empty to only build the artifact)'
        required: false
        default: ''
      release_name:
        description: 'Release title (leave empty to use "Mochy Music <tag>")'
        required: false
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build_release:
    name: Build Universal FOSS Release APK
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate signing keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Universal FOSS Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: ./gradlew :app:testUniversalFossDebugUnitTest --tests '*StatusGeometryTest*' :app:assembleUniversalFossRelease --no-configuration-cache --console=plain --warning-mode summary

      - name: Rename APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/universalFoss/release/*.apk release-apk/mochy-universal-foss-release.apk

      - name: Collect build metadata
        id: meta
        run: |
          version_name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          version_code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          apk="release-apk/mochy-universal-foss-release.apk"
          size=$(du -h "$apk" | cut -f1)
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mochy-universal-foss-release
          path: release-apk/mochy-universal-foss-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APK_SIZE: ${{ steps.meta.outputs.size }}
          APK_SHA: ${{ steps.meta.outputs.sha256 }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          name="${RELEASE_NAME:-Mochy Music $VERSION_NAME}"

          cat > notes.md <<EOF
          Sync with upstream **Mochy 8.4.2** (\`7e590802\`), keeping this fork's Vietnamese localisation, desktop module and floating capsule.

          ### Floating lyrics improvements
          - The floating capsule keeps the width you set by dragging the right-hand grip; lyrics no longer resize the window.
          - Song title and artist sit above a centred lyric line. Every line uses the same text size, and long lines scroll inside the capsule instead of shrinking.
          - Automatically aligns to the center or the nearest safe screen edge after dragging.
          - Tap the capsule to expand playback controls: previous/next, play/pause, repeat and shuffle. Tap outside to collapse it.
          - Dragging and resizing remain available while touch gestures are in progress.
          - Style 2 karaoke renderer with per-word timing and display-synchronized animation, replacing the old 60 ms sweep timer.
          - Requests up to 120 Hz while playing when high refresh rate is enabled. Actual frame rate depends on the device and system policy.

          ### What's new from 8.4.2
          - Manual queue entries play in FIFO order ahead of Autoplay; Play next works on a stopped player.
          - Spotify Canvas integration and configurable Canvas provider order.
          - Improved landscape, tablet and foldable layouts, including a compact navigation bar on short screens.
          - Sleep timer presets, live countdown and interactive controls.
          - DASH segment cache-key fix, FLAC export/remux and local audio/lyrics import improvements.
          - Module browsing and login improvements, plus updated translations.
          - Album track ordering and Remove from history fixes; tapping a cover opens song details.

          ### Kept from this fork
          - Vietnamese UI with this fork's translations and upstream's new resource-based screens
          - Separate desktop application module and packaging workflows
          - Crossmix transition mode
          - Neon and Mask karaoke lyric styles
          - Cropped device-image player background, direct video cover toggle
          - Playback, network and lyric stability fixes

          ### Build
          - \`versionCode $VERSION_CODE\`, \`versionName $VERSION_NAME\`
          - Universal FOSS, minSdk 24, targetSdk 37
          - Signed with a debug keystore generated at build time: **for testing only**. It cannot go on Play Store and cannot upgrade an install signed with a different key.
          - SHA-256 \`$APK_SHA\`

          Built by the \`Build Release APK\` workflow on \`$SHORT_SHA\`. APK size: $APK_SIZE.
          EOF

          # idempotent: drop an existing release/tag so a re-run republishes cleanly
          gh release delete "$TAG" --yes --cleanup-tag || true

          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi

          gh release create "$TAG" \
            release-apk/mochy-universal-foss-release.apk \
            --title "$name" \
            --notes-file notes.md \
            "${flags[@]}"

          echo "Published: $(gh release view "$TAG" --json url --jq .url)"
