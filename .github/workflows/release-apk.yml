name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_release:
    name: Build Universal FOSS Release APK
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate signing keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Universal FOSS Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: ./gradlew assembleUniversalFossRelease --no-configuration-cache --console=plain --warning-mode summary

      - name: Rename APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/universalFoss/release/*.apk release-apk/mochy-universal-foss-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mochy-universal-foss-release
          path: release-apk/mochy-universal-foss-release.apk
          if-no-files-found: error
