name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (leave empty to only build the artifact)'
        required: false
        default: ''
      release_name:
        description: 'Release title (leave empty to use "Mochy Music <tag>")'
        required: false
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_release:
    name: Build Universal FOSS Release APK
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore the signing key every build is signed with
        env:
          MOCHY_KEYSTORE_B64: ${{ secrets.MOCHY_KEYSTORE_B64 }}
        run: |
          # one key for every build, so a new APK installs over the one already on the phone and
          # keeps its library; a key generated per run makes each build a different app to Android
          if [ -n "${MOCHY_KEYSTORE_B64}" ]; then
            mkdir -p app/keystore
            printf '%s' "${MOCHY_KEYSTORE_B64}" | base64 -d > app/keystore/persistent-debug.keystore
            echo "Signing with the repository's persistent key."
          else
            echo "::warning title=No persistent signing key::MOCHY_KEYSTORE_B64 is not set, so this APK cannot install over builds from other runs. See scripts/persistent-signing-key.sh."
            mkdir -p ~/.android
            [ -f ~/.android/debug.keystore ] || keytool -genkey -v \
              -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Universal FOSS Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: ./gradlew :modules:soundcloud:test :app:testUniversalFossDebugUnitTest :app:assembleUniversalFossRelease --no-configuration-cache --console=plain --warning-mode summary

      - name: Rename APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/universalFoss/release/*.apk release-apk/mochy-universal-foss-release.apk

      - name: Collect build metadata
        id: meta
        run: |
          version_name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          version_code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          apk="release-apk/mochy-universal-foss-release.apk"
          size=$(du -h "$apk" | cut -f1)
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mochy-universal-foss-release
          path: release-apk/mochy-universal-foss-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APK_SIZE: ${{ steps.meta.outputs.size }}
          APK_SHA: ${{ steps.meta.outputs.sha256 }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          PRERELEASE: ${{ inputs.prerelease || false }}
          MOCHY_KEYSTORE_B64: ${{ secrets.MOCHY_KEYSTORE_B64 }}
        run: |
          # the note in the release body has to match how the APK was actually signed
          if [ -n "${MOCHY_KEYSTORE_B64}" ]; then
            export SIGNING_NOTE="Signed with this repository's persistent key: a new release installs over the previous one and keeps your library."
          else
            export SIGNING_NOTE="Signed with a key generated for this run: **for testing only**. It cannot upgrade an install signed by a different key. Add the MOCHY_KEYSTORE_B64 secret (see scripts/persistent-signing-key.sh) to make releases install in place."
          fi
          set -euo pipefail
          name="${RELEASE_NAME:-Mochy Music $VERSION_NAME}"

          cat > notes.md <<EOF
          ### SoundCloud · Việt Nam
          - Home recommendations and the SoundCloud discovery feed use Vietnamese discovery and Vietnamese metadata signals; there is no global-chart fallback or global-region filter.
          - Explicit non-Vietnam country metadata is excluded. This is metadata-based curation, not a guarantee of the uploader's physical location or track licensing.
          - Public like counts and paginated comments are available. Sign-in opens SoundCloud's official site; native account syncing and write actions require registered OAuth configuration.
          - Native account syncing and write actions require registered OAuth configuration. No on-device playback validation is included in this build.
          - **Signing:** $SIGNING_NOTE

          ### Build
          - \`versionCode $VERSION_CODE\`, \`versionName $VERSION_NAME\`
          - Universal FOSS, minSdk 24, targetSdk 37
          - $SIGNING_NOTE
          - SHA-256 \`$APK_SHA\`

          Built by the \`Build Release APK\` workflow on \`$SHORT_SHA\`. APK size: $APK_SIZE.
          EOF

          # idempotent: drop an existing release/tag so a re-run republishes cleanly
          gh release delete "$TAG" --yes --cleanup-tag || true

          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi

          gh release create "$TAG" \
            release-apk/mochy-universal-foss-release.apk \
            --title "$name" \
            --notes-file notes.md \
            "${flags[@]}"

          echo "Published: $(gh release view "$TAG" --json url --jq .url)"
