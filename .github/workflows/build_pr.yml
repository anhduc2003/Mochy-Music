name: Build PR

on:
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore the signing key every build is signed with
        env:
          MOCHY_KEYSTORE_B64: ${{ secrets.MOCHY_KEYSTORE_B64 }}
        run: |
          # one key for every build, so a new APK installs over the one already on the phone and
          # keeps its library; a key generated per run makes each build a different app to Android
          if [ -n "${MOCHY_KEYSTORE_B64}" ]; then
            mkdir -p app/keystore
            printf '%s' "${MOCHY_KEYSTORE_B64}" | base64 -d > app/keystore/persistent-debug.keystore
            echo "Signing with the repository's persistent key."
          else
            echo "::warning title=No persistent signing key::MOCHY_KEYSTORE_B64 is not set, so this APK cannot install over builds from other runs. See scripts/persistent-signing-key.sh."
            mkdir -p ~/.android
            [ -f ~/.android/debug.keystore ] || keytool -genkey -v \
              -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build, Test and Lint Universal FOSS Debug APK
        run: ./gradlew --console=plain assembleUniversalFossDebug :app:testUniversalFossDebugUnitTest :app:lintUniversalFossDebug --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-universal-debug-pr-${{ github.event.number }}
          path: app/build/outputs/apk/universalFoss/debug/*.apk
          # a pr's apk is for trying it before merging, after a week it's just eating actions storage
          retention-days: 7
